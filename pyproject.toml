[project]
name = "ha-tankdata"
version = "0.2.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "home-assistant-frontend==20260826.7",
    "homeassistant==2026.9.2",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
