name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test inside the supported Home Assistant image
        run: >-
          docker run --rm -v "$PWD:/work" -w /work
          --entrypoint sh ghcr.io/home-assistant/home-assistant:2026.9.2
          -c "pip install pytest pytest-asyncio ruff && python -m pytest -q && ruff check custom_components tests scripts && ruff format --check custom_components tests scripts && python scripts/build_release.py"
